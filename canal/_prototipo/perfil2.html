<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head>
<body>

    <linearGradient id="qg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FFB800"/></linearGradient>

  <rect width="1080" height="1080" fill="url(#bgN)"/>

    <g fill="#9AA7B8" stroke="#0B1320" stroke-width="0">
      <rect x="-125" y="245" width="250" height="44" rx="20"/><rect x="-115" y="295" width="230" height="40" rx="18" fill="#7D8A9C"/>
      <rect x="-100" y="340" width="200" height="38" rx="18"/><path d="M -60,384 H 60 L 30,420 H -30 Z" fill="#5C6878"/>
    </g>
    <g transform="translate(-72,-40)"><ellipse rx="44" ry="52" fill="#fff"/><circle cx="8" cy="-6" r="25" fill="#1B1B2F"/><circle cx="17" cy="-16" r="8" fill="#fff"/></g>

      <line x1="0" y1="-330" x2="0" y2="-400"/><line x1="-215" y1="-245" x2="-265" y2="-295"/><line x1="215" y1="-245" x2="265" y2="-295"/>
      <line x1="-300" y1="-60" x2="-370" y2="-70"/><line x1="300" y1="-60" x2="370" y2="-70"/>
    </g>
  </g>

  <!-- VARIANTE B: interrogación con cara -->
  <g id="B" transform="translate(540,520)" style="display:none">
    <path d="M -150,-150 C -150,-330 170,-330 170,-150 C 170,-40 30,-20 30,90 L 30,130" fill="none" stroke="url(#qg)" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(75,-245)"><ellipse rx="34" ry="40" fill="#fff"/><circle cx="7" cy="-4" r="19" fill="#1B1B2F"/><circle cx="14" cy="-12" r="6" fill="#fff"/></g>
    <path d="M5,-195 Q30,-170 55,-195" fill="none" stroke="#7A3B00" stroke-width="10" stroke-linecap="round"/>

<script>
const NS="http://www.w3.org/2000/svg",R=document.getElementById("rays");
for(let i=0;i<16;i++){const a=i/16*2*Math.PI,a2=a+Math.PI/32,e=document.createElementNS(NS,"path");e.setAttribute("d",`M540,520 L${540+900*Math.cos(a)},${520+900*Math.sin(a)} L${540+900*Math.cos(a2)},${520+900*Math.sin(a2)} Z`);e.setAttribute("fill","#fff");R.appendChild(e);}
function variante(v){document.getElementById("A").style.display=v==="A"?"":"none";document.getElementById("B").style.display=v==="B"?"":"none";}
</script></body></html>
